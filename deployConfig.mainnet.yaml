# PoD deploy config — MAINNET (Ethereum, Avalanche C-Chain, COTI mainnet).
# Select with: DEPLOY_CONFIG=deployConfig.mainnet.yaml
# CreateX on COTI mainnet: 0xba5Ed099633D3B313e4D5F7bdc1305d3c28ba5Ed
# CreateX deploy tx: 0xb6274b80bc7cda162df89894c7748a5cb7ba2eaa6004183c41a1837c3b072f1e
# No Sablier/payroll addresses.
forks:
  enabled: false
  sourceRpc: http://127.0.0.1:8545
  cotiRpc: http://127.0.0.1:8546
  label: LIVE
inboxSalt:
  label: pod.inbox.v2.3
  deployer: '0xdf9f8fca4591227c092fcbab45a846c19fb6d1ae'
  salt: ''
  guardedSalt: ''
  address: ''
  bytecodeNote: CreateX deterministic address depends on Inbox creation bytecode, including Ownable(address(1)) placeholder
    owner in the constructor. Bump `label` (and clear salt/guardedSalt/address) whenever Inbox bytecode changes before redeploying.
  runbook: 'After inbox deploy: priceOracle (setInboxTokens → seed prices/feeds → refreshCache) → feeConfig (min-fee templates
    + gasPriceBounds) → wireInboxOracle. On non-EIP-1559 chains (COTI), gasPriceBounds are required. Inbox.init wires FeeManager
    (and COTI MpcAbiReEncode) as DELEGATECALL helpers; apps still bind only the Inbox address.'
mpcAbiCodecSalt:
  label: 'pod.mpc-abi-reencode.v1.0'
  deployer: '0xdf9f8fca4591227c092fcbab45a846c19fb6d1ae'
  bytecodeNote: 'COTI only. CREATE3 MpcAbiReEncode (Inbox DELEGATECALL target). Bump label independently of inboxSalt.'
feeManagerSalt:
  label: 'pod.fee-manager.v1.0'
  deployer: '0xdf9f8fca4591227c092fcbab45a846c19fb6d1ae'
  bytecodeNote: 'CREATE3 FeeManager (Inbox DELEGATECALL target) on every chain. Bump label independently of inboxSalt.'

